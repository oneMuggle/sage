id: xueshu789
display_name: 学术资源站
home_url: https://www.xueshu789.cc/
domains:
  - xueshu789.cc
  - 82.157.23.222
access:
  mode: browser
  login:
    method: form
    url: https://www.xueshu789.cc/
    account_label: 您的卡号
    password_label: 您的密码
    url_contains: /dbList/
    title_not_contains: 登录
capabilities:
  search: true
  detail: true
  pdf_download: true
  fulltext: true
  citation_export: false
search:
  mode: interactive
  url_template: "https://www.xueshu789.cc/dbItem/3"
  entry_url: "https://www.xueshu789.cc/dbItem/3"
  input_selectors:
    - "input[placeholder*='检索词']"
    - "textarea[placeholder*='检索词']"
  submit_key: Enter
  wait_after_s: 5
  result_hint: 每条结果含题名/作者/来源链接（均指向 doDownload）+ 下载/原版阅读/CNKI AI阅读；结果总数在页面上方
  wait_for: []
  pagination:
    type: click_text
    text: 下一页
  result_fields:
    title:
      selector: ""
    authors:
      selector: ""
    source:
      selector: ""
    year:
      selector: ""
detail:
  open_by: click_text
  fields:
    abstract:
      selector: ""
pdf:
  entry:
    selector: "a.downloadlink"
    text: 下载
  post_click_wait_s: 8
  note: "必须点击 a.downloadlink 元素（完整 href 含 &ddata=文件名|库|题名|库|hash）；不要用快照中截断的 URL 直连，否则 doDownload 报参数错误"
  forbid:
    - CAJ
  validate:
    magic: "%PDF-"
    title_match: true
rate_limit:
  min_interval_s: 5
  max_batch: 20
compliance:
  note: 仅使用本人账号/机构授权；不绕过付费墙；验证码交还用户
  default_enabled: false
version: "0.3.0"
status: ready
last_verified_at: "2026-11-22"
