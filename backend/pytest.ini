[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
# 护栏: 单个测试超过 120s 视为失败。此前编排确认门控（默认 600s 超时）
# 曾让 5+ 个 multi-mode 集成测试各静默挂满 600s，CI 从 ~12min 涨到 ~83min
# 且全绿无感知。个别确实耗时的用例用 @pytest.mark.timeout(N) 单独放宽。
timeout = 120
addopts =
    -ra
    --strict-markers
    --strict-config
    --showlocals
markers =
    unit: 单元测试
    integration: 集成测试
    e2e: 端到端测试
    slow: 慢速测试（默认跳过）
