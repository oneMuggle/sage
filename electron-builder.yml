appId: com.sage.app
productName: Sage
copyright: Copyright © 2026 Sage Team
asar: true
asarUnpack:
  # Phase 3 (2026-09-25): node-pty 是 native addon（C++ binding），必须从 asar 中解包
  # 才能在运行时加载 .node 二进制。asar 内文件无法被 dlopen。
  - '**/node_modules/node-pty/**'
  - '**/node_modules/node-pty-prebuilt-multiarch/**'
directories:
  output: release/${version}
  buildResources: resources
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  # 2026-09-08 (Win7 launch incident): tray icon + window icon live under
  # repo-root/build/. tray.ts and main.ts resolve
  #   join(__dirname, '..', '..', 'build', 'icon.ico')
  # which in packaged + asar resolves to <asar>/build/icon.ico (since
  # __dirname = <asar>/dist-electron/electron/, going up two levels lands
  # at <asar>/). Without this electron-builder entry, the folder is
  # stripped and Win7's system tray init crashes
  # (`continuing without tray`). icon.png is kept alongside even though
  # Win7 doesn't use it, because some Linux distros fall back to PNG
  # tray and re-introducing the pattern is cheaper than re-debugging the
  # next time someone removes "an unused" entry.
  - build/icon.ico
  - build/icon.png
  # electron/**/* (TS 源码) 不进安装包: 编译产物已在 dist-electron/**/*,
  # 运行时无任何代码读取 asar 内的源码目录, 纯属安装包死重。
  - "!**/.git"
  - "!**/node_modules/.cache"
  - "!**/archive/**"
  - "!**/__tests__/**"
  - "!**/*.test.{ts,tsx,js,jsx}"
  - "!**/*.map"
  - "!**/.DS_Store"
extraResources:
  # Build provenance manifest — single source of truth for packaged Electron
  # to know its buildId/commit/branch/version/electronVersion/pythonVersion.
  # Bundle scripts (scripts/bundle-python.ps1 on win7,
  # scripts/bundle-python-main.ps1 on main) emit this file at
  # resources/build-manifest.json during the packaging step; main.ts loads
  # it from <resourcesPath>/build-manifest.json at startup. CI verifies the
  # final installer/AppImage actually contains it (see .github/workflows/
  # ci.yml "Verify packaged build-manifest.json" step).
  - from: "resources/build-manifest.json"
    to: "build-manifest.json"
  # CHANGELOG.md — 更新日志，供帮助页面显示
  - from: "CHANGELOG.md"
    to: "CHANGELOG.md"
  # Python embedded runtime + backend code.
  # - main: bundled by scripts/bundle-python-main.ps1 (Python 3.11 + requirements.txt)
  # - release/win7: bundled by scripts/bundle-python.ps1 (Python 3.8 + requirements-py38.txt)
  # Both scripts emit resources/python, resources/backend, resources/sage-core.
  # resources/start-backend.bat was REMOVED in release/win7 commit 973d44c as
  # dead code (main.ts spawns python.exe directly via the resolver, never
  # invokes the .bat). Both branches now share the same 3-entry shape.
  - from: "resources/python"
    to: "python"
    filter:
      - "**/*"
      - "!**/__pycache__"
  # NOTE: .pyc is deliberately NOT excluded from the two Python entries.
  # In protected builds (SAGE_PROTECT_CODE=true) the bundler strips backend/*.py
  # and leaves sourceless .pyc as the ONLY copy of the code — excluding the
  # extension would ship a backend/ holding just main.py, and every
  # `import backend.*` would raise ModuleNotFoundError at runtime. Dev-mode
  # bytecode all lives under __pycache__/ (excluded above), so allowing .pyc
  # costs nothing on the development path.
  - from: "resources/backend"
    to: "backend"
    filter:
      - "**/*"
      - "!**/__pycache__"
  - from: "resources/sage-core"
    to: "sage-core"
    filter:
      - "**/*"
  # MSYS2 bash runtime for Win7 (bundled by scripts/bundle-git-bash.ps1).
  # shell_resolver._find_windows_bash() third-priority candidate falls back
  # to this path when system Git bash is absent (Win7 default).
  # PortableGit v2.46.2 is the last version that runs on Win7 SP1; v2.47+ uses
  # BCrypt APIs absent on Win7 and fails at first bash.exe spawn.
  - from: "resources/tools"
    to: "tools"
    filter:
      - "**/*"
  # Win7 内网启动修复文档 + 脚本 (服务禁用路径, PR feat/win7-service-fix).
  # 用户场景: 企业组策略 / 管控软件禁用 TrustedInstaller / wuauserv 服务,
  # Sage 启动 splash 后白屏 / 消失。runtime-check.ts 检测到 service 异常后
  # 引导用户在资源管理器打开此目录, 用户右键 fix.bat 以管理员身份运行。
  # 放在顶级 extraResources (与既有 5 条一致), 不引入 win.extraResources
  # 新范式 (electron-builder 26.x 虽支持但项目零使用该特性)。
  - from: "resources/win7-fix"
    to: "win7-fix"
    filter:
      - "**/*"
  # NOTE: start-backend.bat removed — was dead code (electron/main.ts spawns
  # python.exe directly, never invoked the .bat). See PR #107/#111/#112.

# Win7 + Win10/11 NSIS installer (electron-builder 24.x)
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  # Force code signing stub (Phase 3 will add real cert)
  # signtoolOptions:
  #   sign: scripts/sign-windows.js
  artifactName: ${productName}-Setup-${version}.${ext}

nsis:
  include: build/installer.nsh    # ← NEW: NSIS customInstall macro (bundles VCRedist)
  oneClick: false # Show installer wizard (Win7 UAC friendlier than silent)
  perMachine: false # HKCU install, no admin required
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Sage
  uninstallDisplayName: Sage ${version}
  # Win7 prerequisites (also surfaced in docs/technical/26-packaging-matrix.md):
  #   1. KB3033929 (SHA-2 code signing support) — Win7 SP1 must have this or
  #      Sage.exe signed with SHA-2 cert refuses to launch (Phase 3 signing).
  #   2. KB3140245 (TLS 1.2, optional) — not required by Sage itself.
  #   3. Win7 SP1 x64 minimum (32-bit Win7 not supported by Electron 21).
  # VC++ Redistributable: bundled by build/installer.nsh customInstall (no user action).

# macOS: skip for now (focus is Win7 first; can revisit later)
# U-Brand (2026-09): macOS packaging currently disabled (target: null), so .icns
# isn't consumed today. When mac packaging is enabled, add:
#   icon: build/icon.icns
# and ensure build/icon.icns is generated from the same master design as
# build/icon.{ico,png} (committed in 27fcb09c).
#
# Toolchain gap: this repo has no local .icns generator. options when mac
# packaging is enabled:
#   1. macOS CI runner: run `iconutil --convert icns icons.iconset/` from a
#      1024/512/256/128/64/32/16 PNG set.
#   2. cross-platform npm deps: `png2icons` or `icon-gen` Node packages can
#      emit .icns from a single 1024×1024 PNG source.
# Until then, resources/icon.icns (June 23, pre-U-Brand) is stale relative to
# build/icon.{ico,png} (Sept 2, post-U-Brand) but unused.
mac:
  target: null
  identity: null

# Linux: AppImage (universal) + deb (Ubuntu/Debian native)
linux:
  target:
    - AppImage
    - deb
  icon: build/icon.png
  category: Office
  synopsis: Sage — agentic knowledge & chat desktop
  description: |
    Sage is a local-first desktop client that combines LLM chat, agent
    orchestration, and a personal knowledge wiki. Backed by Python +
    FastAPI for offline-capable AI workflows.
  maintainer: Sage Team <sage@example.com>
  vendor: Sage Team
  artifactName: ${productName}-${version}.${ext}

deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
  packageCategory: utils
  priority: optional
  artifactName: sage_${version}_amd64.${ext}

# electron-builder publish config (off by default for Phase 1)
publish: null