<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Sage logo">
  <!-- Diagonal split background: mint top-left, purple bottom-right -->
  <defs>
    <clipPath id="sageRound">
      <rect width="64" height="64" rx="12"/>
    </clipPath>
  </defs>
  <g clip-path="url(#sageRound)">
    <rect width="64" height="64" fill="#5eead4"/>
    <polygon points="0,64 64,0 64,64" fill="#a855f7"/>
  </g>

  <!-- Bold white S, with a subtle navy drop shadow for legibility -->
  <text x="32" y="48"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="44" font-weight="800"
        text-anchor="middle" fill="#0f172a" opacity="0.18"
        transform="translate(0.6,1.2)">S</text>
  <text x="32" y="48"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="44" font-weight="800"
        text-anchor="middle" fill="#ffffff">S</text>
</svg>
