name: CI

on:
  push:
    branches: [main, develop, release/win7]
    # paths-ignore: skip CI for docs/markdown-only commits (no source/test changes).
    # Saves ~5-10 min of backend pytest + frontend vitest on pure documentation PRs.
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/CODEOWNERS'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [main, develop, release/**]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/CODEOWNERS'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ========== Backend (Win7 LTS): Python 3.8 兼容性 ==========
  # - 仅 release/win7 触发（保护 win7 钉死的 Python 3.8 兼容性）
  # - 用独立 conda env sage-backend-py38 隔离 main 的 sage-backend
  # - 钉死依赖版本（backend/requirements-py38.txt）
  # - coverage 强门禁 ≥ 80%
  backend-py38:
    name: Backend (Python 3.8, Win7 LTS)
    if: |
      github.ref == 'refs/heads/release/win7' ||
      (github.event_name == 'pull_request' && github.base_ref == 'release/win7')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Miniconda + Python 3.8
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: '3.8'
          channels: conda-forge

      - name: Create py38 env
        shell: bash -el {0}
        run: |
          conda create -n sage-backend-py38 python=3.8 -y
          conda run -n sage-backend-py38 pip install --upgrade pip

      - name: Install backend deps (py38, locked)
        shell: bash -el {0}
        run: |
          conda run -n sage-backend-py38 pip install -r backend/requirements-py38.txt
          conda run -n sage-backend-py38 pip install -r backend/requirements-dev.txt

      - name: Ruff check
        shell: bash -el {0}
        run: |
          conda run -n sage-backend-py38 ruff check backend/

      - name: Pytest (py38, hex mode) with coverage
        shell: bash -el {0}
        run: |
          conda run -n sage-backend-py38 bash -c "cd backend && pytest --cov --cov-report=xml --cov-report=term --cov-fail-under=80"

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v4
        with:
          file: backend/coverage.xml
          flags: backend-py38
          fail_ci_if_error: false

  # ========== Backend: lint + type + test + coverage ==========
  backend:
    name: Backend (Python)
    if: |
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/develop' ||
      (github.event_name == 'pull_request' && (github.base_ref == 'main' || github.base_ref == 'develop'))
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: backend/environment.yml
          python-version: '3.11'
          activate-environment: sage-backend
          channels: conda-forge

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dev tools
        shell: bash -el {0}
        run: |
          # 从仓库根运行: requirements.txt 中 -e ./packages/sage-core 路径
          # 相对于仓库根 (packages/sage-core 不在 backend/ 下)
          conda run -n sage-backend pip install -r backend/requirements.txt
          conda run -n sage-backend pip install ruff mypy import-linter

      - name: Ruff check
        shell: bash -el {0}
        run: |
          conda run -n sage-backend ruff check backend/

      - name: Mypy (domain + ports)
        shell: bash -el {0}
        run: |
          conda run -n sage-backend mypy backend/domain backend/ports
        continue-on-error: true # P0 期间允许，domain/ports 还没建

      # PG2.11：5 层依赖图（hexagonal-architecture contract）
      # - backend/ 是 import-linter 的 root_package
      # - 必须 cd backend 让 import-linter 找到 pyproject.toml
      # - PYTHONPATH=.. 让它能 import "backend.*" 模块
      - name: Import linter (hexagonal architecture)
        shell: bash -el {0}
        run: |
          conda run -n sage-backend bash -c "cd backend && PYTHONPATH=.. lint-imports"

      # PG2.12：双轨回归
      # - 主路径：API_MODE=hex（默认），强制 coverage ≥ 80%，并上传 codecov
      # - 兜底路径：API_MODE=legacy，no-cov 冒烟（continue-on-error，作为安全网）
      - name: Pytest hex (default) with coverage
        shell: bash -el {0}
        run: |
          conda run -n sage-backend bash -c "cd backend && pytest --cov --cov-report=xml --cov-report=term --cov-fail-under=80"

      - name: Pytest legacy (smoke, no-cov)
        shell: bash -el {0}
        run: |
          conda run -n sage-backend bash -c "cd backend && API_MODE=legacy pytest --no-cov -q"
        continue-on-error: true # 兜底：legacy 仅作安全网，单测不一致不阻塞 PR

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v4
        with:
          file: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

  # ========== Dependency audit: read-only npm + Python reports ==========
  # This job intentionally does not mutate package manifests or fix findings.
  # Critical/high findings are enforced by the final gate after reports upload.
  dependency-audit:
    name: Dependency audit (Node 22.12 + Python 3.11)
    if: |
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/develop' ||
      (github.event_name == 'pull_request' && (github.base_ref == 'main' || github.base_ref == 'develop'))
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22.12
        uses: actions/setup-node@v4
        with:
          node-version: '22.12'
          cache: 'npm'

      - name: Pin npm
        run: |
          npm install --global npm@11.12.1
          test "$(node --version)" = "v22.12.0"
          test "$(npm --version)" = "11.12.1"

      - name: Install npm dependencies
        id: npm-ci
        run: npm ci
        continue-on-error: true

      - name: npm audit (all dependencies)
        id: npm-audit-all
        if: always()
        run: npm audit --json > npm-audit.json
        continue-on-error: true

      - name: npm audit (production dependencies)
        id: npm-audit-prod
        if: always()
        run: npm audit --omit=dev --json > npm-audit-prod.json
        continue-on-error: true

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create Python audit venv and install locked auditor
        id: python-install
        run: |
          python -m venv .venv-dependency-audit
          .venv-dependency-audit/bin/python -m pip install --disable-pip-version-check pip-audit==2.9.0
          .venv-dependency-audit/bin/python -m pip install --disable-pip-version-check -r backend/requirements.txt
        continue-on-error: true

      - name: pip-audit (production requirements)
        id: pip-audit
        if: always()
        run: |
          if [ ! -x .venv-dependency-audit/bin/pip-audit ]; then
            printf '%s\n' '{"error":"pip-audit environment was not created"}' > pip-audit.json
            exit 1
          fi
          .venv-dependency-audit/bin/pip-audit -r backend/requirements.txt --format=json > pip-audit.json
        continue-on-error: true

      - name: Upload dependency audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-reports
          path: |
            npm-audit.json
            npm-audit-prod.json
            pip-audit.json
          if-no-files-found: warn

      - name: Enforce dependency audit gate
        env:
          NPM_CI_OUTCOME: ${{ steps.npm-ci.outcome }}
          PYTHON_INSTALL_OUTCOME: ${{ steps.python-install.outcome }}
          NPM_AUDIT_ALL_OUTCOME: ${{ steps.npm-audit-all.outcome }}
          NPM_AUDIT_PROD_OUTCOME: ${{ steps.npm-audit-prod.outcome }}
          PIP_AUDIT_OUTCOME: ${{ steps.pip-audit.outcome }}
        run: |
          python scripts/check_dependency_audit.py \
            --npm npm-audit.json \
            --npm-prod npm-audit-prod.json \
            --pip pip-audit.json \
            --policy .github/dependency-audit-policy.json


  # ========== Frontend: lint + type + test + coverage ==========
  frontend:
    name: Frontend (TypeScript)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --force --force

      - name: Lint
        # --cache: ESLint stores results in node_modules/.cache/eslint/ between
        # runs. Subsequent CI invocations skip already-validated unchanged files,
        # typically cutting lint time from ~25s to <5s on warm cache.
        run: npm run lint -- --cache

      - name: Type check
        # --incremental: tsc writes .tsbuildinfo and only re-checks changed files.
        # Cold ~40s → warm <15s on subsequent runs.
        run: npm run typecheck -- --incremental

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v4
        with:
          file: coverage/coverage-final.json
          flags: frontend
          fail_ci_if_error: false

  # ========== Desktop Build: Electron 21 + electron-builder 矩阵 ==========
  # - 3 OS 矩阵：ubuntu (AppImage) / macos (DMG) / windows (NSIS)
  # - Linux/macOS runner 不能跑 Windows NSIS 产物但能 cross-build；
  #   windows-latest 直接产 NSIS 离线安装包
  # - electron-builder 缓存 npm + Electron 二进制加速构建
  desktop-build:
    name: Electron build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # macOS DMG 暂未启用（Phase 1 electron-builder.yml mac.target: null）
        # 待 Win7 验证后补回: os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12'
          cache: 'npm'

      - name: Cache electron-builder downloads
        uses: actions/cache@v4
        with:
          # electron-builder writes its binary cache to:
          #   Linux/macOS: ~/.cache/electron-builder (and ~/.cache/electron)
          #   Windows:     %LOCALAPPDATA%\electron-builder\Cache
          #               (= ~/AppData/Local/electron-builder/Cache)
          # The original config only listed POSIX paths, so Windows runners
          # never matched the cache key → full re-download every build.
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install Linux build deps (webkit2gtk for Electron cross-build)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libdrm2 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            libgbm1 \
            libasound2t64

      - name: Install npm dependencies
        run: npm ci --force

      - name: Verify command contract tests
        run: npm exec -- vitest run electron/__tests__/backendLauncher.test.ts electron/__tests__/backendSupervisor.test.ts electron/__tests__/commands.test.ts

      - name: Build frontend + Electron
        run: npm run electron:build

      # Task 0 (win7 parity): generate resources/build-manifest.json before
      # electron-builder so extraResources (electron-builder.yml line 31) can
      # pick it up. CI does NOT call scripts/bundle-python-main.ps1 — that
      # script only runs on tag-driven release workflows. The ci.yml path
      # must write the manifest itself, cross-platform, from CI context.
      # Without this step the packaged AppImage/NSIS is missing
      # resources/build-manifest.json → main.ts falls back to
      # createBuildManifest() defaults and silently disables buildId-based
      # health-ownership validation. The two "Verify packaged build-manifest.json"
      # steps below would fail. We use the dedicated cross-platform Node
      # helper scripts/ci-write-manifest.mjs invoked via PowerShell (which
      # is preinstalled on every GitHub-hosted runner and avoids shell-
      # escape hell on Windows). GitHub Actions does NOT accept `shell:
      # node`. The .mjs extension is mandatory because package.json has
      # `"type": "module"` (since the main TS toolchain migrated to ESM)
      # AND the @typescript-eslint config rejects `require()` calls; ESM
      # `import` satisfies both.
      - name: Generate build-manifest.json (cross-platform)
        shell: pwsh
        run: node scripts/ci-write-manifest.mjs

      - name: Package (Linux AppImage + deb)
        if: matrix.os == 'ubuntu-latest'
        run: npx electron-builder --linux AppImage deb --publish never

      # Task 0 (win7 parity): validate that the packaged Linux artifact actually
      # contains resources/build-manifest.json. electron-builder writes the
      # intermediate unpacked staging directory at release/{version}/linux-unpacked/
      # (see directories.output in electron-builder.yml line 8 — package.json's
      # version field determines the leaf). The .AppImage and .deb are built
      # from that directory, so its presence is a proof the artifacts contain
      # the manifest too. If extraResources is missing the entry, the build
      # manifest would not be packaged and the Electron main process would
      # fall back to `createBuildManifest()` defaults, which silently disables
      # buildId-based health-ownership validation. We locate the versioned
      # dir via glob (Get-ChildItem -Recurse) rather than hardcoding the
      # version so this works regardless of the next package.json bump.
      - name: Verify packaged build-manifest.json (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: pwsh
        run: |
          # electron-builder nests the unpacked dir under release/${version}/
          # (see directories.output in electron-builder.yml line 8). Grep for
          # the linux-unpacked dir under release/* rather than hardcoding the
          # version, since CI uses package.json's version field directly.
          $found = Get-ChildItem -Path release -Directory -Recurse -Filter linux-unpacked -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch '[\\/]node_modules[\\/]' } |
            Select-Object -First 1
          if (-not $found) {
            Write-Error "::error::Could not find release/**/linux-unpacked directory. electron-builder output structure may have changed."
            exit 1
          }
          $manifest = Join-Path $found.FullName 'resources/build-manifest.json'
          if (-not (Test-Path $manifest)) {
            Write-Error "::error::Missing $manifest in packaged Linux artifact (check electron-builder.yml extraResources)"
            exit 1
          }
          Write-Host "Linux packaged build-manifest.json OK at $manifest"

      - name: Verify Linux artifacts (vitest)
        if: matrix.os == 'ubuntu-latest'
        run: npm run test:packaging

      - name: Fetch VC++ Redistributable (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: pwsh scripts/fetch-vcredist.ps1

      # M0 Task 4: stdlib-only Office path-safety canary.
      # Validates backend.office.path_safety.is_within (the sibling-prefix
      # traversal fix) using only Python 3's pathlib. Runs before the
      # Windows NSIS packaging step so a regression in path_safety fails
      # the build fast, without waiting for the full Python embeddable
      # bundle (several hundred MB) to be assembled. The release bundle
      # itself still does the heavier `import backend.main` canary in
      # scripts/bundle-python-main.ps1 — this lightweight guardrail is in
      # addition, not a replacement.
      # NB: path_safety transitively imports backend.office.models which
      # depends on pydantic. The canary is "almost-stdlib" — it needs
      # pydantic installed in the runner Python. Install it once before
      # invoking the script.
      - name: Install canary dependency (pydantic, Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: python -m pip install --quiet pydantic

      - name: Verify Office path safety (stdlib canary, Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/verify-office-paths.py

      - name: Package (Windows NSIS)
        if: matrix.os == 'windows-latest'
        env:
          # CI validation only — use placeholder suffix.
          # Release workflows (release.yml / release-win7.yml) use -win10 / -win7.
          ARTIFACT_SUFFIX: ci
        run: npx electron-builder --win --publish never

      # Task 0 (win7 parity): validate that the packaged Windows NSIS artifact
      # contains resources/build-manifest.json. electron-builder writes the
      # intermediate unpacked staging directory at release/{version}/win-unpacked/
      # (see directories.output in electron-builder.yml line 8 — package.json's
      # version field determines the leaf). The .exe is built from that dir, so
      # the manifest's presence is a proof the installer contains it too. If
      # extraResources is missing the entry, the Electron main process would
      # fall back to `createBuildManifest()` defaults, which silently disables
      # buildId-based health-ownership validation.
      - name: Verify packaged build-manifest.json (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $found = Get-ChildItem -Path release -Directory -Recurse -Filter win-unpacked -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch '[\\/]node_modules[\\/]' } |
            Select-Object -First 1
          if (-not $found) {
            Write-Error "::error::Could not find release/**/win-unpacked directory. electron-builder output structure may have changed."
            exit 1
          }
          $manifest = Join-Path $found.FullName 'resources/build-manifest.json'
          if (-not (Test-Path $manifest)) {
            Write-Error "::error::Missing $manifest in packaged Windows artifact (check electron-builder.yml extraResources)"
            exit 1
          }
          Write-Host "Windows packaged build-manifest.json OK at $manifest"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: electron-${{ matrix.os }}
          path: |
            release/**/*.exe
            release/**/*.AppImage
            release/**/*.deb
            release/**/*.dmg
          if-no-files-found: error

  # ========== Electron smoke test (Phase 4 lightweight, Win7 真机烟测前替代) ==========
  # - 用 playwright._electron 启动 Electron + 验证 IPC bridge
  # - SAGE_SKIP_BACKEND=1 跳过 FastAPI spawn（CI 无 sage-backend conda env）
  # - 验证项：BrowserWindow 出现 / window.electronAPI 暴露 / 前端 HTML 加载
  # - 截图保存为 artifact 用于人工 review
  # - Win7 真机烟测在 Phase 5 (release 前) 跑 self-hosted Win7 runner
  electron-smoke:
    name: Electron smoke (playwright-electron)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci --force

      - name: Build frontend + Electron
        run: npm run electron:build

      - name: Smoke test
        env:
          SAGE_SKIP_BACKEND: '1'
          CI: 'true'
        run: npx playwright test e2e/electron/smoke.spec.ts --reporter=line

      - name: Upload smoke screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electron-smoke-screenshot
          path: e2e/electron/screenshots/*.png
          if-no-files-found: ignore

  # ========== All-checks aggregator ==========
  # - 强门禁：backend + frontend + electron-smoke 全部 success 才算通过
  # - desktop-build 暂不强制门禁（首次跑通优先，后续加 continue-on-error → required）
  # - PR 也能在 backend job 上跑（见 backend/backend-py38 的 if: 改 PR + push 都触发）
  all-green:
    name: All Checks
    needs: [backend, backend-py38, frontend, electron-smoke, dependency-audit]
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: Check all required jobs passed
        run: |
          set -e
          # 必过项：frontend + electron-smoke 永远要过
          [ "${{ needs.frontend.result }}" = "success" ]
          [ "${{ needs.electron-smoke.result }}" = "success" ]
          # Dependency audit only runs for main/develop and their PRs; release/win7
          # intentionally remains on its independent Python 3.8 dependency contract.
          if [ "${{ needs.dependency-audit.result }}" != "success" ] && [ "${{ needs.dependency-audit.result }}" != "skipped" ]; then
            echo "::error::Dependency audit failed: ${{ needs.dependency-audit.result }}"
            exit 1
          fi

          backend_status="${{ needs.backend.result }}"
          py38_status="${{ needs.backend-py38.result }}"

          # 两个 backend 都失败/被 skip → 不通过
          # 例外：两个都 skipped（PR 不在 main/win7/release win7 分支上，理论不会发生因为
          #  workflow trigger 限定了，但保留防御性）
          if [ "$backend_status" != "success" ] && [ "$py38_status" != "success" ]; then
            if [ "$backend_status" = "skipped" ] && [ "$py38_status" = "skipped" ]; then
              echo "Both backend jobs skipped (no relevant branch) — OK"
            else
              echo "::error::Backend CI failed: backend=$backend_status, backend-py38=$py38_status"
              exit 1
            fi
          fi
          echo "All required checks passed"
