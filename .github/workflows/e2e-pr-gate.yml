name: E2E PR Gate
on:
  pull_request:
    branches: [main]
jobs:
  stub-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
      - run: npm run build:electron
      # Electron needs an X server on the headless Ubuntu runner.
      - run: xvfb-run -a npm run test:smoke
  stub-deep:
    runs-on: ubuntu-latest
    needs: stub-smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
      - run: npm run build:electron
      - run: xvfb-run -a npx playwright test --project=electron-stub-deep
  live-boot:
    runs-on: ubuntu-latest
    needs: stub-deep
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: conda-incubator/setup-miniconda@v3
        with: { python-version: '3.11' }
      - run: conda create -n sage-backend python=3.11 -y
      - run: conda run -n sage-backend pip install -r backend/requirements.txt
      - run: npm ci && npm run build:electron
      - run: xvfb-run -a npx playwright test --project=electron-live-boot
