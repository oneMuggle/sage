name: E2E PR Gate
on:
  pull_request:
    branches: [main]
jobs:
  stub-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22.12' }
      - run: npm ci
      - run: npm run build:electron
      # Electron needs an X server on the headless Ubuntu runner.
      - run: xvfb-run -a npm run test:smoke
  stub-deep:
    runs-on: ubuntu-latest
    needs: stub-smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22.12' }
      - run: npm ci
      - run: npm run build:electron
      - run: xvfb-run -a npx playwright test --project=electron-stub-deep
  live-boot:
    runs-on: ubuntu-latest
    needs: stub-deep
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22.12' }
      - uses: conda-incubator/setup-miniconda@v3
        with: { python-version: '3.11' }
      - run: conda create -n sage-backend python=3.11 -y
      - run: conda run -n sage-backend pip install -r backend/requirements.txt
      - run: npm ci && npm run build:electron
      - run: |
          set -euo pipefail
          export SAGE_LOCAL_AUTH_TOKEN="$(conda run -n sage-backend python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          conda run -n sage-backend python -m backend.main > backend.log 2>&1 &
          backend_pid=$!
          trap 'kill "$backend_pid" 2>/dev/null || true; cat backend.log' EXIT
          for attempt in $(seq 1 60); do
            if ! kill -0 "$backend_pid" 2>/dev/null; then
              cat backend.log
              exit 1
            fi
            if curl --fail --silent --show-error http://127.0.0.1:8765/health; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              cat backend.log
              exit 1
            fi
            sleep 2
          done
          xvfb-run -a npx playwright test --project=electron-live-boot
