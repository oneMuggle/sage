# Win7 LTS ← main 自动同步（Phase 3 · 对齐固化）
#
# 两个 job：
#   parity  : 每次 main push / 每日 / 手动 —— 生成 parity 看板 artifact，并分级：
#             real（实质业务差异）→ fail；main-only / win7-only → warning（不阻塞）。
#   sync    : push / 每日定时 / 手动 —— 用 scripts/win7/auto_sync.py 把 main 整体 merge 到
#             release/win7：D 类冻结件自动 ours、py38 回写 + 门禁；无冲突就开 PR，
#             有冲突则把带冲突标记的分支推上去并开 draft PR 附报告，由人接手。
#
# 与 B1-B6 手工批次的关系：B3 之后残差已收敛到 win7 必要差异（见 docs/win7-sync/parity.md），
# 后续 main 的增量走本 workflow；EOL 2027-12-13 后随 release/win7 一起归档。
#
# ⚠️ 推送凭据（2026-10-21 P0）：sync job 会把包含 `.github/workflows/*` 变更的分支推上去，
#    而 GITHUB_TOKEN **无法**推送 workflow 文件——这是平台硬限制，且 `permissions:` 里
#    根本没有 `workflows` 这个键（写了会让整个文件解析失败，所有触发全挂）。
#    因此推送凭据走 `secrets.WIN7_SYNC_TOKEN`（fine-grained PAT：Contents RW +
#    Workflows RW），且必须通过 actions/checkout 的 `token:` 注入（checkout 会把凭据
#    写进 local git config，`git push` 用的就是它，而不是 GH_TOKEN）。
#    未配置该 secret 时自动降级：保持 release/win7 的 workflow 文件原样再推送。
#
# ⚠️ 放置位置：本文件必须同时存在于 **main**（默认分支）—— GitHub 的 schedule 事件
#    只从默认分支的 workflow 文件触发，push 事件也只读触发 ref（main）上的文件。
#    两个 job 都 checkout `release/win7`，所以脚本本体（scripts/win7/*）只需维护在
#    release/win7；main 上只放这一个 yml（见 docs/win7-sync/README.md）。

name: Win7 Sync

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  schedule:
    - cron: '30 19 * * *'   # 03:30 Asia/Shanghai
  workflow_dispatch:
    inputs:
      do_sync:
        description: '执行 merge 并开 PR（否则只出 parity 看板）'
        type: boolean
        default: true

# ⚠️ 勿加 `workflows: write`：`workflows` 不属于 GITHUB_TOKEN 的合法 permission 键，
#    加入后 GitHub 会以 HTTP 422 `Unexpected value 'workflows'` 拒绝解析整个文件，
#    定时任务与所有触发都会静默失效。推送 workflow 文件的唯一办法是换凭据（见文件头）。
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: win7-sync
  # 每次运行都从 release/win7 重建 + 取最新 main，结果幂等；push 触发后
  # 旧运行已被新提交取代，直接取消，避免高频合并把队列堵住。
  cancel-in-progress: true

jobs:
  parity:
    name: Parity 看板（main vs release/win7）
    runs-on: ubuntu-latest
    outputs:
      unmerged: ${{ steps.report.outputs.unmerged }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: release/win7          # 脚本本体在 release/win7；本 yml 从 main 触发
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate parity report
        id: report
        run: |
          git fetch origin main release/win7
          python scripts/win7/parity_report.py \
            --base origin/main --head origin/release/win7 \
            --out parity-auto.md --json parity-auto.json
          # 单一数据源：从 JSON 取分级计数，交给后续步骤决定 warning 还是 fail
          python -c 'import json;d=json.load(open("parity-auto.json",encoding="utf-8"));g=d.get("grades",{});print("real=%d"%g.get("real",0));print("mainonly=%d"%g.get("main-only",0));print("win7only=%d"%g.get("win7-only",0));print("unmerged=%d"%d.get("unmerged",0))' >> "$GITHUB_OUTPUT"
          cat parity-auto.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: win7-parity
          path: |
            parity-auto.md
            parity-auto.json
      # 分级止血：main-only / win7-only 长期存在，钉红只会造成告警疲劳（近期定时任务
      # 连续红但无人处理）。这两类降为 warning 并写进 job summary，仍可在 artifact 追溯。
      - name: Annotate non-blocking drift (main-only / win7-only)
        if: steps.report.outputs.mainonly != '0' || steps.report.outputs.win7only != '0'
        run: |
          echo "::warning::非阻塞漂移：main-only=${{ steps.report.outputs.mainonly }}、win7-only=${{ steps.report.outputs.win7only }}（详见 artifact win7-parity）"
          {
            echo "### 非阻塞漂移（不 fail，仅记录）"
            echo ""
            echo "| 等级 | 文件数 |"
            echo "|---|---:|"
            echo "| main-only（漏合入） | ${{ steps.report.outputs.mainonly }} |"
            echo "| win7-only（win7 独有） | ${{ steps.report.outputs.win7only }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      # real = 实质业务差异，必须人工审阅，保持硬失败
      - name: Fail on real drift
        if: steps.report.outputs.real != '0'
        run: |
          echo "::error::存在 ${{ steps.report.outputs.real }} 个 real（实质业务差异）文件，需人工审阅，见 artifact win7-parity"
          exit 1

  sync:
    name: main → release/win7 自动 merge
    needs: parity
    if: >-
      always() &&
      needs.parity.outputs.unmerged != '0' &&
      (github.event_name == 'push' ||
      github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.do_sync))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: release/win7
          # checkout 把凭据写进 local git config，后续 git push 用的就是它。
          # GITHUB_TOKEN 无法推送 .github/workflows/**，必须换成带 Workflows 权限的 PAT。
          token: ${{ secrets.WIN7_SYNC_TOKEN != '' && secrets.WIN7_SYNC_TOKEN || github.token }}
      - name: Resolve push credential
        id: cred
        env:
          PAT: ${{ secrets.WIN7_SYNC_TOKEN }}
        run: |
          if [ -n "$PAT" ]; then
            echo "has_pat=true" >> "$GITHUB_OUTPUT"
            echo "推送凭据：WIN7_SYNC_TOKEN（含 Workflows: write）"
          else
            echo "has_pat=false" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置 WIN7_SYNC_TOKEN：本次同步会保持 release/win7 的 .github/workflows/** 原样再推送（GITHUB_TOKEN 永远无法推送 workflow 文件变更）。配置带 Workflows: write 的 fine-grained PAT 后可完整同步。"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'     # py38_compat_rewrite 本身用 PEP 604 语法，需 3.10+
      - run: pip install libcst
      - name: Configure git
        run: |
          git config user.name "win7-sync-bot"
          git config user.email "win7-sync-bot@users.noreply.github.com"
      - name: Run auto_sync
        id: sync
        run: |
          BR="sync/win7-main-$(date +%Y%m%d)"
          echo "branch=$BR" >> "$GITHUB_OUTPUT"
          set +e
          python scripts/win7/auto_sync.py --commit --branch "$BR" \
            --report sync-report.md --report-json sync-report.json
          echo "rc=$?" >> "$GITHUB_OUTPUT"
          set -e
          cat sync-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: win7-sync-report
          path: |
            sync-report.md
            sync-report.json

      # 无 PAT 时：把 .github/workflows/** 还原成 release/win7 的版本，否则 push 必被
      # GitHub 拒绝（refusing to allow a GitHub App ... without workflows permission）。
      - name: Keep workflow files untouched (no PAT)
        id: strip
        if: steps.sync.outputs.rc == '0' && steps.cred.outputs.has_pat != 'true'
        run: |
          if ! git diff --quiet origin/release/win7 -- .github/workflows; then
            # 目录级回退：先清空 index 里的 workflow 条目，再从 release/win7 取回。
            # 不能只用 git restore —— main 新增的文件（如 audit-watch.yml）不会被删掉。
            git rm -r -q --cached --ignore-unmatch .github/workflows || true
            git checkout origin/release/win7 -- .github/workflows || true
            git commit --amend --no-edit -q
            echo "::warning::已回退 .github/workflows 变更（缺 WIN7_SYNC_TOKEN）"
          fi
          if git diff --quiet origin/release/win7 HEAD; then
            echo "noop=1" >> "$GITHUB_OUTPUT"
            echo "::warning::除 workflow 文件外无改动，本次不推送"
          fi

      # rc=0：已提交 → 推分支 + 开 PR（CI 会跑 backend-py38 全套）
      - name: Push & open PR (clean merge)
        if: steps.sync.outputs.rc == '0' && steps.strip.outputs.noop != '1'
        run: |
          BR="${{ steps.sync.outputs.branch }}"
          git push -f origin "HEAD:$BR"
          if gh pr view "$BR" --json number >/dev/null 2>&1; then
            gh pr edit "$BR" --body-file sync-report.md
          else
            gh pr create --base release/win7 --head "$BR" \
              --title "chore(win7-sync): merge main → release/win7 ($(date +%Y-%m-%d))" \
              --body-file sync-report.md --label win7-sync
          fi

      # rc=2：有冲突 → 把冲突现场提交到分支（含 <<<< 标记）并开 draft PR，@owner 接手
      - name: Push conflict branch & open draft PR
        if: steps.sync.outputs.rc == '2'
        run: |
          BR="${{ steps.sync.outputs.branch }}"
          git add -A
          git -c core.autocrlf=false commit -q -m "WIP(win7-sync): 冲突现场，待人工解决（勿合并）" || true
          if [ "${{ steps.cred.outputs.has_pat }}" != "true" ] && ! git diff --quiet origin/release/win7 -- .github/workflows; then
            git rm -r -q --cached --ignore-unmatch .github/workflows || true
            git checkout origin/release/win7 -- .github/workflows || true
            git -c core.autocrlf=false commit -q --amend --no-edit || true
            echo "::warning::已回退 .github/workflows 冲突现场（缺 WIN7_SYNC_TOKEN）"
          fi
          git push -f origin "HEAD:$BR"
          if ! gh pr view "$BR" --json number >/dev/null 2>&1; then
            gh pr create --draft --base release/win7 --head "$BR" \
              --title "[需人工] win7-sync: main → release/win7 冲突 ($(date +%Y-%m-%d))" \
              --body-file sync-report.md --label win7-sync --label needs-human
          else
            gh pr edit "$BR" --body-file sync-report.md
          fi
          echo "::warning::合并存在冲突，已开 draft PR $BR"

      - name: Fail on gate error
        if: steps.sync.outputs.rc == '1'
        run: |
          echo "::error::auto_sync 门禁失败（py38 或 merge 异常），见 artifact win7-sync-report"
          exit 1
