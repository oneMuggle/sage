# Release LTS Workflow — Windows 7 LTS 维护分支专用
#
# 触发: push tag v*-lts (如 v0.4.9-alpha.55-win7) 到 release/win7 分支
# 目标: Windows 7 SP1 x64 only (Electron 21.4.4 冻结)
#
# 与 release.yml 差异:
#   - 触发条件:  tag 含 '-lts' 后缀
#   - 产物:      仅 Windows NSIS, artifactName 用 tier 后缀 (alpha-win7 / beta-win7 / rc-win7 / win7)
#   - 不构建:    Linux / macOS (Win7 LTS 不覆盖)
#   - EOL:       2027-12-13 归档, 届时删除本 workflow + release/win7 分支
#
# 双版本流水线 (2026-09-24):
#   - build-windows (Source mode):  SAGE_PROTECT_CODE=false, 默认推荐
#   - build-windows-cython (Cython): SAGE_PROTECT_CODE=true,  实验性, 含 -cython 后缀
#   - upload-release:               合并两 job 产物到同一 release
# 详见 docs/superpowers/specs/2026-09-24-win7-dual-build-and-diagnostics-design.md
# LTS 策略与 Release 工作流详见 docs/technical/31-win7-lts.md §2 + §9

name: Release (Win7 LTS)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # 必需: gh release upload 需要 write 权限

jobs:
  build-windows:
    name: Build Windows (Win7 LTS - Source)
    # Only act on LTS-suffixed tags; non-LTS tags skip this job entirely
    if: "contains(github.ref_name, '-win7')"

    runs-on: windows-latest

    env:
      SAGE_PROTECT_CODE: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12'
          cache: 'npm'

      - name: Sync version from git tag to package.json
        # electron-builder reads version from package.json, but git tag is the source of truth.
        # Tag format: v0.4.9-alpha.62-win7 → package.json version: 0.4.9-alpha.62-win7
        # The '-win7' suffix is a valid semver prerelease identifier and is intentionally
        # preserved so electron-builder's artifactName expands to Sage-Setup-*-win7.exe
        # (matching the release notes documentation).
        run: |
          $tagVersion = "${{ github.ref_name }}"
          # Remove 'v' prefix only; keep '-win7' as valid semver prerelease:
          # v0.4.9-alpha.62-win7 → 0.4.9-alpha.62-win7
          $pkgVersion = $tagVersion -replace '^v', ''
          Write-Host "Syncing package.json version to $pkgVersion (from tag $tagVersion)"
          npm version $pkgVersion --no-git-tag-version --allow-same-version
          # Verify
          $actual = node -p "require('./package.json').version"
          if ($actual -ne $pkgVersion) {
            Write-Error "::error::Version mismatch: package.json=$actual, expected=$pkgVersion"
            exit 1
          }
          Write-Host "✓ package.json version synced to $pkgVersion"

      # CRITICAL (v0.4.5-alpha.2-win7 bundling fix):
      # hnswlib==0.8.0 source build requires Python.h from a FULL Python distribution
      # (the embeddable zip used previously lacks headers). Python 3.11+ requires
      # Windows 8.1+, so we must use 3.8.10 (last 3.8.x compatible with Win7).
      # setup-python installs full Python (with headers), bundle-python.ps1
      # copies it to resources/python/ instead of downloading embeddable.
      - name: Setup Python 3.8.10 (Win7 LTS bundling)
        uses: actions/setup-python@v5
        with:
          python-version: '3.8.10'

      - name: Cache electron-builder downloads (LTS namespace)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          # -win7 suffix prevents cache collision with main release
          # prerelease- namespace prevents alpha/beta/rc vs stable cache pollution
          key: ${{ runner.os }}-electron-win7-source-${{ contains(github.ref_name, '-') && 'prerelease-' || '' }}${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-win7-source-
            ${{ runner.os }}-electron-win7-

      - name: Install npm dependencies
        run: npm ci --force

      - name: Bundle Python backend (Source mode)
        shell: pwsh
        run: pwsh scripts/bundle-python.ps1

      - name: Bundle MSYS2 bash (Win7 LTS)
        # shell_resolver._find_windows_bash() third-priority candidate.
        # PortableGit v2.46.2 is the last version with Win7 SP1 support;
        # v2.47+ uses BCrypt APIs absent on Win7 and fails at first spawn.
        shell: pwsh
        run: pwsh scripts/bundle-git-bash.ps1

      - name: Verify build manifest (Source mode)
        shell: pwsh
        run: |
          $manifest = Get-Content resources/build-manifest.json | ConvertFrom-Json
          if ($manifest.manifestVersion -ne 1) { throw "Unsupported manifest version" }
          if ($manifest.packagingMode -ne 'source') { throw "Expected source mode, got $($manifest.packagingMode)" }
          foreach ($field in @('buildId','commit','branch','version','electronVersion','pythonVersion','packagingMode')) {
            if ([string]::IsNullOrWhiteSpace($manifest.$field)) { throw "Missing manifest field: $field" }
          }
          Write-Host ($manifest | ConvertTo-Json -Compress)

      # 本地 AI 模型（OCR + Embedding）必须在 electron-builder 前就位，
      # 否则 extraResources 的 resources/models 为空，安装包缺失模型。
      - name: Restore local AI models cache
        uses: actions/cache@v4
        with:
          path: resources/models
          key: ${{ runner.os }}-sage-models-${{ hashFiles('scripts/download-models.sh') }}

      - name: Fetch local AI models
        shell: bash
        run: bash scripts/download-models.sh

      - name: Build offline component packs
        shell: pwsh
        env:
          SAGE_COMPONENT_SIGNING_KEY: ${{ secrets.SAGE_COMPONENT_SIGNING_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SAGE_COMPONENT_SIGNING_KEY)) {
            Write-Host "::warning::SAGE_COMPONENT_SIGNING_KEY not configured; skipping component packs"
            exit 0
          }
          $keyPath = Join-Path $env:RUNNER_TEMP 'component-signing-key.pem'
          Set-Content -Path $keyPath -Value $env:SAGE_COMPONENT_SIGNING_KEY -NoNewline
          python -m pip install "cryptography==47.0.0"
          python scripts/build-component-packs.py --all --key $keyPath --output release/components
          if ($LASTEXITCODE -ne 0) { throw "component pack build failed" }
          $publicKey = python scripts/build-component-packs.py --print-public-key --key $keyPath
          if ($LASTEXITCODE -ne 0) { throw "component public key derivation failed" }
          Set-Content -Path resources/component-public-key.pem -Value $publicKey -Encoding ascii

      - name: Upload component packs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sage-components
          path: release/components/*
          if-no-files-found: warn

      - name: Build frontend + Electron
        run: npm run electron:build

      # dist-web/ 由 electron-builder.yml extraResources 打进 resources/dist-web，
      # SageWeb.cmd（开始菜单「Sage 网页模式」）据此以 SAGE_WEB_MODE 提供浏览器界面。
      - name: Build web fallback frontend (dist-web)
        run: npm run build:web

      - name: Fetch VC++ Redistributable (Windows)
        shell: pwsh
        run: pwsh scripts/fetch-vcredist.ps1

      - name: Build Windows NSIS (Win7 LTS - Source)
        run: npx electron-builder --win nsis --publish never

      - name: Upload Source installer as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sage-setup-source
          # Exclude core variant — uploaded separately by 'Upload core installer as artifact'
          path: |
            release/*/Sage-Setup-*.exe
            !release/*/Sage-Setup-*-core.exe
          if-no-files-found: error

      # ── core 变体：不含内置 AI 模型的瘦安装包 ──────────────────
      # 全量 nsis 已打入 resources/models；此处临时移开，让
      # electron-builder.yml 的 extraResources `from: resources/models`
      # 指向空目录，从而产出约 61MB 更小的安装包。与 .sagepkg 通道配合：
      # core 包用户首次启动后通过设置页「组件管理」或 SageDoctor 导入
      # .sagepkg 启用语义检索/OCR（HashEmbedder 兜底，非阻断）。
      - name: Stage core variant — move models aside
        shell: pwsh
        run: |
          $moved = Join-Path $env:RUNNER_TEMP 'staged-models'
          if (Test-Path $moved) { Remove-Item -Recurse -Force $moved }
          Move-Item -Path 'resources\models' -Destination $moved -Force
          New-Item -ItemType Directory -Path 'resources\models' | Out-Null
          Write-Host "models moved to $moved; placeholder created"

      - name: Build Windows NSIS core (Win7 LTS - Source, no models)
        run: npx electron-builder --win nsis --publish never --config.win.artifactName='${productName}-Setup-${version}-core.${ext}'

      - name: Restore models after core build
        if: always()
        shell: pwsh
        run: |
          $moved = Join-Path $env:RUNNER_TEMP 'staged-models'
          if (Test-Path 'resources\models') { Remove-Item -Recurse -Force 'resources\models' }
          Move-Item -Path $moved -Destination 'resources\models' -Force
          Write-Host "models restored"

      - name: Upload core installer as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sage-setup-core
          path: release/*/Sage-Setup-*-core.exe
          if-no-files-found: error

  build-windows-cython:
    name: Build Windows (Win7 LTS - Cython)
    # Only act on LTS-suffixed tags; non-LTS tags skip this job entirely
    if: "contains(github.ref_name, '-win7')"

    runs-on: windows-latest

    env:
      SAGE_PROTECT_CODE: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12'
          cache: 'npm'

      - name: Setup Python 3.8.10 (Win7 LTS bundling)
        uses: actions/setup-python@v5
        with:
          python-version: '3.8.10'

      - name: Cache electron-builder downloads (LTS namespace)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          # Cython job uses separate cache key namespace; the two caches
          # can diverge (e.g. Cython build pulls extra setuptools wheels).
          key: ${{ runner.os }}-electron-win7-cython-${{ contains(github.ref_name, '-') && 'prerelease-' || '' }}${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-win7-cython-
            ${{ runner.os }}-electron-win7-

      - name: Install npm dependencies
        run: npm ci --force

      - name: Bundle Python backend (Cython mode)
        shell: pwsh
        env:
          SAGE_PROTECT_CODE: "true"
        run: pwsh scripts/bundle-python.ps1

      - name: Bundle MSYS2 bash (Win7 LTS)
        shell: pwsh
        run: pwsh scripts/bundle-git-bash.ps1

      - name: Verify build manifest (Cython mode)
        shell: pwsh
        run: |
          $manifest = Get-Content resources/build-manifest.json | ConvertFrom-Json
          if ($manifest.manifestVersion -ne 1) { throw "Unsupported manifest version" }
          if ($manifest.packagingMode -ne 'cython') { throw "Expected cython mode, got $($manifest.packagingMode)" }
          foreach ($field in @('buildId','commit','branch','version','electronVersion','pythonVersion','packagingMode')) {
            if ([string]::IsNullOrWhiteSpace($manifest.$field)) { throw "Missing manifest field: $field" }
          }
          Write-Host ($manifest | ConvertTo-Json -Compress)

      # 本地 AI 模型（OCR + Embedding）必须在 electron-builder 前就位，
      # 否则 extraResources 的 resources/models 为空，安装包缺失模型。
      - name: Restore local AI models cache
        uses: actions/cache@v4
        with:
          path: resources/models
          key: ${{ runner.os }}-sage-models-${{ hashFiles('scripts/download-models.sh') }}

      - name: Fetch local AI models
        shell: bash
        run: bash scripts/download-models.sh

      - name: Build frontend + Electron
        run: npm run electron:build

      # dist-web/ 由 electron-builder.yml extraResources 打进 resources/dist-web，
      # SageWeb.cmd（开始菜单「Sage 网页模式」）据此以 SAGE_WEB_MODE 提供浏览器界面。
      - name: Build web fallback frontend (dist-web)
        run: npm run build:web

      - name: Fetch VC++ Redistributable (Windows)
        shell: pwsh
        run: pwsh scripts/fetch-vcredist.ps1

      - name: Inject component public key (Cython build)
        shell: pwsh
        env:
          SAGE_COMPONENT_SIGNING_KEY: ${{ secrets.SAGE_COMPONENT_SIGNING_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SAGE_COMPONENT_SIGNING_KEY)) { exit 0 }
          $keyPath = Join-Path $env:RUNNER_TEMP 'component-signing-key.pem'
          Set-Content -Path $keyPath -Value $env:SAGE_COMPONENT_SIGNING_KEY -NoNewline
          python -m pip install "cryptography==47.0.0"
          $publicKey = python scripts/build-component-packs.py --print-public-key --key $keyPath
          if ($LASTEXITCODE -ne 0) { throw "component public key derivation failed" }
          Set-Content -Path resources/component-public-key.pem -Value $publicKey -Encoding ascii

      - name: Build Windows NSIS (Win7 LTS - Cython)
        # Override artifactName to add -cython suffix, distinguishing
        # this experimental build from the recommended Source version.
        # The base name (Sage-Setup-${version}) is unchanged so version
        # detection (electron-updater etc.) still works.
        run: npx electron-builder --win nsis --publish never --config.win.artifactName='${productName}-Setup-${version}-cython.${ext}'

      - name: Upload Cython installer as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sage-setup-cython
          path: release/*/Sage-Setup-*-cython.exe
          if-no-files-found: error

  upload-release:
    name: Upload to LTS GitHub Release
    needs: [build-windows, build-windows-cython]
    runs-on: ubuntu-latest
    steps:
      - name: Download Source installer artifact
        uses: actions/download-artifact@v4
        with:
          name: sage-setup-source
          path: artifacts/source
      - name: Download Cython installer artifact
        uses: actions/download-artifact@v4
        with:
          name: sage-setup-cython
          path: artifacts/cython
      - name: Download core installer artifact
        uses: actions/download-artifact@v4
        with:
          name: sage-setup-core
          path: artifacts/core
      - name: Download component packs artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: sage-components
          path: artifacts/components
      - name: Verify installers downloaded
        run: |
          set -e
          shopt -s nullglob globstar
          # upload-artifact@v4 preserves the release/*/ directory structure,
          # so we need a recursive glob (**) to find the .exe files.
          src=(artifacts/source/**/*.exe)
          cython=(artifacts/cython/**/*.exe)
          core=(artifacts/core/**/*.exe)
          if [ ${#src[@]} -eq 0 ]; then echo "::error::No source installer found"; exit 1; fi
          if [ ${#cython[@]} -eq 0 ]; then echo "::error::No cython installer found"; exit 1; fi
          if [ ${#core[@]} -eq 0 ]; then echo "::error::No core installer found"; exit 1; fi
          echo "Source:   ${src[0]##*/} ($(stat -c %s "${src[0]}") bytes)"
          echo "Cython:   ${cython[0]##*/} ($(stat -c %s "${cython[0]}") bytes)"
          echo "Core:     ${core[0]##*/} ($(stat -c %s "${core[0]}") bytes)"
      - name: Upload to LTS GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Use the original tag (e.g. v0.4.9-alpha.55-win7) as the release identifier,
          # so it becomes a separate release page from main's v0.2.0
          tag_name: ${{ github.ref_name }}
          files: |
            artifacts/**/*.exe
            artifacts/components/**/*
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          body: |
            ## Sage ${{ github.ref_name }} (Win7 LTS) — Windows 7 SP1 x64 ONLY

            > ⚠️ **此版本专为 Windows 7 SP1 x64 设计**。
            > Win10+ 用户请改用 [main release](https://github.com/${{ github.repository }}/releases)。

            > **Tier**: ${{ contains(github.ref_name, '-alpha') && 'ALPHA' || contains(github.ref_name, '-beta') && 'BETA' || contains(github.ref_name, '-rc') && 'RELEASE CANDIDATE' || 'STABLE' }}
            > ${{ contains(github.ref_name, '-alpha') && '⚠️ 仅供 Sage 贡献者使用。' || contains(github.ref_name, '-beta') && '⚠️ 公开测试版。' || contains(github.ref_name, '-rc') && '✅ 准稳定版。' || '✅ 稳定版，推荐 Win7 用户升级。' }}

            ### Downloads — Win7 LTS 提供三个版本

            | File | 模式 | 备注 |
            | --- | --- | --- |
            | `Sage-Setup-*-win7.exe` | 源码模式 | ✅ **推荐**，含内置模型，离线即开即用 |
            | `Sage-Setup-*-win7-core.exe` | 源码模式（无模型） | 轻量；安装后需通过设置页「组件管理」或 SageDoctor 导入 `.sagepkg` 以启用语义检索/OCR |
            | `Sage-Setup-*-win7-cython.exe` | Cython 代码保护 | ⚠️ **实验性**，代码保护但有打包风险 |
            | `embedding-bge-small-zh-*.sagepkg` | 离线组件包 | 配合 core 包必选；语义嵌入模型，签名可在设置页「组件管理」导入 |
            | `ocr-models-ppocr-*.sagepkg` | 离线组件包 | 可选；OCR 模型组件包 |

            如果不确定该选哪个，请优先使用源码模式（`-win7.exe`，无 `-cython` / `-core` 后缀）。

            ### Win7 前置

            - **KB3033929** (SHA-2 代码签名支持, 2016 年发布) — Win7 SP1 必装, 否则 Sage.exe 启动被拒
            - x64 only (Electron 21 不支持 Win7 32-bit)

            ### 启动失败排查

            启动后白屏/闪退？Sage 在 `%AppData%\Sage\diagnostic-*.log` 写入诊断报告，
            请将最近一份附到 GitHub Issue。

            ### 风险声明

            ⚠️ 本分支基于 EOL 技术栈 (Electron 21.4.4 + Python 3.8 + Chromium 106)。
            详见 [`docs/technical/31-win7-lts.md`](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/technical/31-win7-lts.md) §6。
          # draft: true — 人工 review release notes 后再 publish
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}