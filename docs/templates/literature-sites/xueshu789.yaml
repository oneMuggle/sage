# xueshu789 站点 profile —— 示例模板，不随产品自动加载。
# 启用方式（任选其一）：
#   cp docs/templates/literature-sites/xueshu789.yaml ~/.sage/literature_sites/
#   或复制到 <项目>/.sage/literature_sites/
# 加载顺序：builtin < ~/.sage/literature_sites < .sage/literature_sites
#
# 实测要点（2026-11-26，仅作启用参考，实际以真机为准）：
#   - 卡号+密码登录，成功后 URL 进 /dbList/，标题不含「登录」
#   - /dbItem/3 可用（重定向知网代理检索页）；/dbItem/1 代理报错；/dbItem/2 触发滑块验证
#   - 下载：完整 href 含 &ddata=文件名|库|题名|库|hash，必须用元素 href（缺 ddata 报「参数错误」）
#   - 2026-11-26 起站点下载改为中间页：doDownload → 「文献下载中」页，约 2s 后跳
#     downurl；downurl 主机写死 oversea.cnki.net，国内库内容在该网关 404。
#     通过 pdf.interstitial 先换 kns.cnki.net 再原域兜底（实测 1.68MB PDF 落盘）。
id: xueshu789
display_name: 学术资源站
home_url: https://www.xueshu789.cc/
domains:
  - xueshu789.cc
  - 82.157.23.222
access:
  mode: browser
  login:
    method: form
    url: https://www.xueshu789.cc/
    account_label: 您的卡号
    password_label: 您的密码
    url_contains: /dbList/
    title_not_contains: 登录
capabilities:
  search: true
  detail: true
  pdf_download: true
  fulltext: true
  citation_export: false
search:
  mode: interactive
  url_template: "https://www.xueshu789.cc/dbItem/3"
  entry_url: "https://www.xueshu789.cc/dbItem/3"
  input_selectors:
    - "input[placeholder*='检索词']"
    - "textarea[placeholder*='检索词']"
  submit_key: Enter
  wait_after_s: 5
  result_hint: 每条结果含题名/作者/来源链接（均指向 doDownload）+ 下载/原版阅读/CNKI AI阅读；结果总数在页面上方
  wait_for: []
  pagination:
    type: click_text
    text: 下一页
  result_fields:
    title:
      selector: ""
    authors:
      selector: ""
    source:
      selector: ""
    year:
      selector: ""
detail:
  open_by: click_text
  # 结果行链接是代理跳转地址，真正的知网摘要页 URL 藏在其 url 查询参数里（base64 编码）。
  # 读取该参数、解码后即为 kns.cnki.net 摘要页，可从中取 #ChDivSummary 正文。
  url_from:
    selector: "a.downloadlink"
    param: "url"
    decode: base64
  fields:
    abstract:
      selector: "#ChDivSummary"
pdf:
  entry:
    selector: "a.downloadlink"
    text: 下载
  post_click_wait_s: 8
  # 下载中间页：doDownload 301 → /doDownload/「文献下载中」页，约 2s 后 JS 跳
  # downurl；该站把 downurl 主机写死为 oversea.cnki.net，国内库内容在海外网关
  # 404。运行时按 host_fallbacks 先换 kns.cnki.net 再原域兜底。
  interstitial:
    url_contains:
      - "cnki.net/docdown"
    host_fallbacks:
      - "kns.cnki.net"
    tab_timeout_s: 6
    sleep_after_open_s: 2.5
    attempt_timeout_s: 15
  note: "下载链接完整 href 含 &ddata=文件名|库|题名|库|hash；不要用快照中截断的 URL 直连，否则 doDownload 报参数错误。中间页主机回退见 interstitial。"
  forbid:
    - CAJ
  validate:
    magic: "%PDF-"
    title_match: true
rate_limit:
  min_interval_s: 5
  max_batch: 20
compliance:
  note: 仅使用本人账号/机构授权；不绕过付费墙；验证码交还用户
  default_enabled: false
version: "0.4.0"
status: ready
last_verified_at: "2026-11-26"
